server:
  port: 8080 # Đổi root thành port
  servlet:
    context-path: /optics

spring:
  datasource:
    # Sử dụng biến môi trường, nếu không có sẽ lấy giá trị mặc định sau dấu :
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optics-management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect


