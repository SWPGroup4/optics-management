name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Khởi tạo dịch vụ PostgreSQL cho workflow
    services:
      postgres:
        image: postgres:latest
        env:
          # Các thông tin này phải khớp chính xác với application-test.yml
          POSTGRES_DB: optics_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # Đảm bảo database đã sẵn sàng trước khi chạy test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Dựa theo java.version trong pom.xml
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      # Sử dụng ./mvnw để đồng bộ phiên bản Maven của dự án
      # Lệnh verify sẽ bao gồm cả package và chạy các bài kiểm tra
      run: ./mvnw clean verify

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
